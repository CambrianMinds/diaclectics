version: '3.8'

services:
  diaclectics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diaclectics_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - .:/app
    networks:
      - diaclectics-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://diaclectics:8000/v1
      - OPENAI_API_KEY=diaclectics-local-key
      - WEBUI_AUTH=False
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - diaclectics
    networks:
      - diaclectics-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_local
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - diaclectics-net

volumes:
  open-webui-data:
  ollama-models:

networks:
  diaclectics-net:
    driver: bridge
